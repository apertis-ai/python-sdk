name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docker-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build test image
        run: docker build --tag apertis-sdk-test --file Dockerfile.test .
      - name: Run deterministic tests without network access
        run: docker run --rm --network none apertis-sdk-test
